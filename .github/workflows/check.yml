name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            desktop
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path backend/Cargo.toml
      - run: cargo check --locked --manifest-path backend/Cargo.toml
      - run: cargo clippy --locked --manifest-path backend/Cargo.toml -- -D warnings

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Dependências WebView Linux
        timeout-minutes: 15
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          # A imagem do runner já traz os índices do apt; tente instalar direto primeiro.
          if ! timeout 300 sudo apt-get install -y -qq --no-install-recommends "${APT_OPTS[@]}" libgtk-3-dev libwebkit2gtk-4.1-dev; then
            timeout 180 sudo apt-get update -qq "${APT_OPTS[@]}"
            timeout 300 sudo apt-get install -y -qq --no-install-recommends "${APT_OPTS[@]}" libgtk-3-dev libwebkit2gtk-4.1-dev
          fi
      - run: cargo check --locked --manifest-path desktop/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
