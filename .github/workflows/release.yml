name: Release multiplataforma

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_NAME: ShadowPainel-${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            binary: shadowpainel
            archive: tar.gz
          - name: windows-x86_64
            os: windows-2022
            binary: shadowpainel.exe
            archive: zip
          - name: macos-x86_64
            os: macos-15-intel
            binary: shadowpainel
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            binary: shadowpainel
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Build backend
        working-directory: backend
        run: cargo build --release

      - name: Assemble package
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          mkdir -p "$ROOT/backend" "$ROOT/frontend/dist"
          cp "backend/target/release/${{ matrix.binary }}" "$ROOT/backend/"
          cp -r frontend/dist/. "$ROOT/frontend/dist/"
          cp README.md "$ROOT/"
          cp -r packaging "$ROOT/"
          printf '\nExecute o binário dentro da pasta backend para que o frontend seja encontrado.\n' > "$ROOT/EXECUTAR.txt"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${ROOT}.zip" "$ROOT" >/dev/null
          else
            tar -czf "${ROOT}.tar.gz" "$ROOT"
          fi
          if [[ "${{ matrix.name }}" != macos-* ]]; then rm -rf "$ROOT"; fi

      - name: Build AppImage and deb (Linux)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          APPDIR="$ROOT.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/shadowpainel/frontend" "$APPDIR/usr/share/doc/shadowpainel" "$APPDIR/DEBIAN"
          cp "backend/target/release/${{ matrix.binary }}" "$APPDIR/usr/bin/shadowpainel"
          cp -r frontend/dist/. "$APPDIR/usr/share/shadowpainel/frontend/"
          cp README.md "$APPDIR/usr/share/doc/shadowpainel/README.md"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export SHADOWPAINEL_FRONTEND_DIR="$HERE/usr/share/shadowpainel/frontend"
          exec "$HERE/usr/bin/shadowpainel" "$@"
          EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/shadowpainel"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" "${ROOT}.AppImage"
          cat > "$APPDIR/DEBIAN/control" <<EOF
          Package: shadowpainel
          Version: ${GITHUB_REF_NAME#v}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: NoteDarck
          Description: Painel local Rust para servidores Minecraft
          EOF
          dpkg-deb --build "$APPDIR" "${ROOT}.deb"
          rm -rf "$APPDIR" appimagetool

      - name: Build DMG (macOS)
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          hdiutil create -volname "ShadowPainel" -srcfolder "$ROOT" -ov -format UDZO -o "${ROOT}.dmg"
          rm -rf "$ROOT"

      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -e
          choco install wixtoolset --no-progress -y
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin:/c/Program Files (x86)/WiX Toolset v3.11/bin"
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          mkdir -p "$ROOT/backend" "$ROOT/frontend/dist"
          cp "backend/target/release/${{ matrix.binary }}" "$ROOT/backend/"
          cp -r frontend/dist/. "$ROOT/frontend/dist/"
          cp README.md "$ROOT/"
          cat > installer.wxs <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="ShadowPainel" Language="1046" Version="0.1.2.0" Manufacturer="NoteDarck" UpgradeCode="2DFA8B31-0C89-4B55-9C3D-5B25F32D5F4A">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perUser" />
              <MajorUpgrade DowngradeErrorMessage="Uma versão mais recente do ShadowPainel já está instalada." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="ShadowPainel" Level="1"><ComponentGroupRef Id="AppFiles" /></Feature>
              <Directory Id="TARGETDIR" Name="SourceDir"><Directory Id="LocalAppDataFolder"><Directory Id="INSTALLFOLDER" Name="ShadowPainel" /></Directory></Directory>
            </Product>
          </Wix>
          EOF
          heat dir "$ROOT" -cg AppFiles -dr INSTALLFOLDER -gg -srd -sreg -sfrag -var var.SourceDir -out files.wxs
          candle installer.wxs files.wxs -dSourceDir="$ROOT"
          light installer.wixobj files.wixobj -out "${ROOT}.msi"
          rm -f installer.wxs files.wxs installer.wixobj files.wixobj
          rm -rf "$ROOT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ShadowPainel-*
          if-no-files-found: error

  publish:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "ShadowPainel ${{ github.ref_name }}" \
            --generate-notes
