name: Release multiplataforma

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_NAME: ShadowPainel-${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            binary: shadowpainel
            archive: tar.gz
          - name: windows-x86_64
            os: windows-2022
            binary: shadowpainel.exe
            archive: zip
          - name: macos-x86_64
            os: macos-13
            binary: shadowpainel
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            binary: shadowpainel
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Build backend
        working-directory: backend
        run: cargo build --release

      - name: Assemble package
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          mkdir -p "$ROOT/backend" "$ROOT/frontend/dist"
          cp "backend/target/release/${{ matrix.binary }}" "$ROOT/backend/"
          cp -r frontend/dist/. "$ROOT/frontend/dist/"
          cp README.md "$ROOT/"
          cp -r packaging "$ROOT/"
          printf '\nExecute o binário dentro da pasta backend para que o frontend seja encontrado.\n' > "$ROOT/EXECUTAR.txt"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${ROOT}.zip" "$ROOT" >/dev/null
          else
            tar -czf "${ROOT}.tar.gz" "$ROOT"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ShadowPainel-*
          if-no-files-found: error

  publish:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "ShadowPainel ${{ github.ref_name }}" \
            --generate-notes
