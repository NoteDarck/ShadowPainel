name: Release multiplataforma

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NAME: ShadowPainel-${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            binary: shadowpainel
            archive: tar.gz
          - name: windows-x86_64
            os: windows-2022
            binary: shadowpainel.exe
            archive: zip
          - name: macos-x86_64
            os: macos-15-intel
            binary: shadowpainel
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            binary: shadowpainel
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versão do pacote
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          V="${V%%[-+]*}"
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) V="0.0.0" ;; esac
          echo "PKG_VERSION=$V" >> "$GITHUB_ENV"

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Build backend
        working-directory: backend
        run: cargo build --release --locked

      - name: Assemble package
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          mkdir -p "$ROOT/backend" "$ROOT/frontend/dist"
          cp "backend/target/release/${{ matrix.binary }}" "$ROOT/backend/"
          cp -r frontend/dist/. "$ROOT/frontend/dist/"
          cp README.md "$ROOT/"
          cp -r packaging "$ROOT/"
          printf 'Execute o binário dentro da pasta backend (ou defina SHADOWPAINEL_FRONTEND_DIR).\nDepois abra http://localhost:4173\n' > "$ROOT/EXECUTAR.txt"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${ROOT}.zip" "$ROOT" >/dev/null
          else
            tar -czf "${ROOT}.tar.gz" "$ROOT"
          fi
          if [[ "${{ matrix.name }}" != macos-* ]]; then rm -rf "$ROOT"; fi

      - name: Build AppImage and deb (Linux)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"

          # ---------- AppImage ----------
          APPDIR="$ROOT.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/shadowpainel/frontend"
          cp "backend/target/release/${{ matrix.binary }}" "$APPDIR/usr/bin/shadowpainel"
          cp -r frontend/dist/. "$APPDIR/usr/share/shadowpainel/frontend/"
          cp packaging/aur/shadowpainel.desktop "$APPDIR/shadowpainel.desktop"
          cp packaging/shadowpainel.svg "$APPDIR/shadowpainel.svg"
          sed -i 's/^Categories=.*/Categories=Utility;/; s/^Exec=.*/Exec=AppRun/; s/^Icon=.*/Icon=shadowpainel/' "$APPDIR/shadowpainel.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          set -eu
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export SHADOWPAINEL_FRONTEND_DIR="$HERE/usr/share/shadowpainel/frontend"
          LOG="${XDG_CACHE_HOME:-$HOME/.cache}/shadowpainel.log"
          mkdir -p "$(dirname "$LOG")"
          : > "$LOG"
          "$HERE/usr/bin/shadowpainel" "$@" >>"$LOG" 2>&1 &
          PID=$!
          URL=""
          for _ in $(seq 1 50); do
            URL=$(sed -n 's/.*ShadowPainel disponível em //p' "$LOG" | tail -n 1 || true)
            [ -n "$URL" ] && break
            sleep 0.1
          done
          if [ -n "$URL" ] && command -v xdg-open >/dev/null 2>&1; then
            xdg-open "$URL" >/dev/null 2>&1 || true
          fi
          wait "$PID"
          EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/shadowpainel"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "${ROOT}.AppImage"

          # ---------- .deb (árvore separada) ----------
          DEBDIR="$ROOT.deb-root"
          mkdir -p "$DEBDIR/DEBIAN" "$DEBDIR/usr/bin" "$DEBDIR/usr/lib/shadowpainel" \
            "$DEBDIR/usr/share/shadowpainel/frontend" \
            "$DEBDIR/usr/share/applications" \
            "$DEBDIR/usr/share/icons/hicolor/scalable/apps" \
            "$DEBDIR/usr/share/doc/shadowpainel"
          cp "backend/target/release/${{ matrix.binary }}" "$DEBDIR/usr/lib/shadowpainel/shadowpainel-core"
          cp packaging/shadowpainel-launcher.sh "$DEBDIR/usr/bin/shadowpainel"
          cp -r frontend/dist/. "$DEBDIR/usr/share/shadowpainel/frontend/"
          cp packaging/aur/shadowpainel.desktop "$DEBDIR/usr/share/applications/shadowpainel.desktop"
          cp packaging/shadowpainel.svg "$DEBDIR/usr/share/icons/hicolor/scalable/apps/shadowpainel.svg"
          cp README.md "$DEBDIR/usr/share/doc/shadowpainel/README.md"
          chmod 755 "$DEBDIR/usr/bin/shadowpainel" "$DEBDIR/usr/lib/shadowpainel/shadowpainel-core"
          cat > "$DEBDIR/DEBIAN/control" <<EOF
          Package: shadowpainel
          Version: ${PKG_VERSION}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: NoteDarck
          Recommends: default-jre-headless
          Description: Painel local Rust para servidores Minecraft
          EOF
          dpkg-deb --root-owner-group --build "$DEBDIR" "${ROOT}.deb"
          rm -rf "$APPDIR" "$DEBDIR" appimagetool

      - name: Build DMG (macOS)
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          hdiutil create -volname "ShadowPainel" -srcfolder "$ROOT" -ov -format UDZO -o "${ROOT}.dmg"
          rm -rf "$ROOT"

      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -e
          choco install wixtoolset --no-progress -y
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin:/c/Program Files (x86)/WiX Toolset v3.11/bin"
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          mkdir -p "$ROOT/backend" "$ROOT/frontend/dist"
          cp "backend/target/release/${{ matrix.binary }}" "$ROOT/backend/"
          cp -r frontend/dist/. "$ROOT/frontend/dist/"
          cp README.md "$ROOT/"
          cat > installer.wxs <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="ShadowPainel" Language="1046" Codepage="65001" Version="$(var.ProductVersion)" Manufacturer="NoteDarck" UpgradeCode="2DFA8B31-0C89-4B55-9C3D-5B25F32D5F4A">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" Platform="x64" />
              <MajorUpgrade DowngradeErrorMessage="Uma versão mais recente do ShadowPainel já está instalada." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="ShadowPainel" Level="1"><ComponentGroupRef Id="AppFiles" /></Feature>
              <Directory Id="TARGETDIR" Name="SourceDir"><Directory Id="ProgramFiles64Folder"><Directory Id="INSTALLFOLDER" Name="ShadowPainel" /></Directory></Directory>
            </Product>
          </Wix>
          EOF
          heat dir "$ROOT" -cg AppFiles -dr INSTALLFOLDER -gg -srd -sreg -sfrag -var var.SourceDir -out files.wxs
          candle -arch x64 -dProductVersion="${PKG_VERSION}.0" installer.wxs files.wxs -dSourceDir="$ROOT"
          light installer.wixobj files.wixobj -out "${ROOT}.msi"
          rm -f installer.wxs files.wxs installer.wixobj files.wixobj
          rm -rf "$ROOT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ShadowPainel-*
          if-no-files-found: error

  publish:
    name: Publicar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum ShadowPainel-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "ShadowPainel ${{ github.ref_name }}" \
            --generate-notes
