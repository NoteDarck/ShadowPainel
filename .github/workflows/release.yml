name: Release multiplataforma

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NAME: ShadowPainel-${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            binary: shadowpainel
            desktop_binary: shadowpainel-desktop
            archive: tar.gz
          - name: windows-x86_64
            os: windows-2022
            binary: shadowpainel.exe
            desktop_binary: shadowpainel-desktop.exe
            archive: zip
          - name: macos-x86_64
            os: macos-15-intel
            binary: shadowpainel
            desktop_binary: shadowpainel-desktop
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            binary: shadowpainel
            desktop_binary: shadowpainel-desktop
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versão do pacote
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          V="${V%%[-+]*}"
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) V="0.0.0" ;; esac
          echo "PKG_VERSION=$V" >> "$GITHUB_ENV"

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            desktop

      - name: Dependências WebView Linux
        if: matrix.name == 'linux-x86_64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Build backend
        working-directory: backend
        run: cargo build --release --locked

      - name: Build desktop nativo
        working-directory: desktop
        run: cargo build --release --locked

      - name: Assemble package
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          mkdir -p "$ROOT/backend" "$ROOT/frontend/dist"
          cp "backend/target/release/${{ matrix.binary }}" "$ROOT/backend/shadowpainel-core${{ endsWith(matrix.binary, '.exe') && '.exe' || '' }}"
          cp "desktop/target/release/${{ matrix.desktop_binary }}" "$ROOT/"
          cp -r frontend/dist/. "$ROOT/frontend/dist/"
          cp README.md "$ROOT/"
          cp -r packaging "$ROOT/"
          printf 'Execute shadowpainel-desktop para abrir a janela própria do ShadowPainel.\nO núcleo Rust é iniciado automaticamente; não é necessário abrir o navegador.\n' > "$ROOT/EXECUTAR.txt"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${ROOT}.zip" "$ROOT" >/dev/null
          else
            tar -czf "${ROOT}.tar.gz" "$ROOT"
          fi
          if [[ "${{ matrix.name }}" != macos-* ]]; then rm -rf "$ROOT"; fi

      - name: Build AppImage and deb (Linux)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"

          # ---------- AppImage ----------
          APPDIR="$ROOT.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib/shadowpainel" "$APPDIR/usr/share/shadowpainel/frontend"
          cp "desktop/target/release/${{ matrix.desktop_binary }}" "$APPDIR/usr/bin/shadowpainel-desktop"
          cp "backend/target/release/${{ matrix.binary }}" "$APPDIR/usr/lib/shadowpainel/shadowpainel-core"
          cp -r frontend/dist/. "$APPDIR/usr/share/shadowpainel/frontend/"
          cp packaging/aur/shadowpainel.desktop "$APPDIR/shadowpainel.desktop"
          cp packaging/shadowpainel.svg "$APPDIR/shadowpainel.svg"
          sed -i 's/^Categories=.*/Categories=Utility;/; s/^Exec=.*/Exec=AppRun/; s/^Icon=.*/Icon=shadowpainel/' "$APPDIR/shadowpainel.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/shadowpainel-desktop" "$@"
          EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/shadowpainel-desktop" "$APPDIR/usr/lib/shadowpainel/shadowpainel-core"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "${ROOT}.AppImage"

          # ---------- .deb (árvore separada) ----------
          DEBDIR="$ROOT.deb-root"
          mkdir -p "$DEBDIR/DEBIAN" "$DEBDIR/usr/bin" "$DEBDIR/usr/lib/shadowpainel" \
            "$DEBDIR/usr/share/shadowpainel/frontend" \
            "$DEBDIR/usr/share/applications" \
            "$DEBDIR/usr/share/icons/hicolor/scalable/apps" \
            "$DEBDIR/usr/share/doc/shadowpainel"
          cp "desktop/target/release/${{ matrix.desktop_binary }}" "$DEBDIR/usr/bin/shadowpainel-desktop"
          cp "backend/target/release/${{ matrix.binary }}" "$DEBDIR/usr/lib/shadowpainel/shadowpainel-core"
          cp -r frontend/dist/. "$DEBDIR/usr/share/shadowpainel/frontend/"
          cp packaging/aur/shadowpainel.desktop "$DEBDIR/usr/share/applications/shadowpainel.desktop"
          cp packaging/shadowpainel.svg "$DEBDIR/usr/share/icons/hicolor/scalable/apps/shadowpainel.svg"
          cp README.md "$DEBDIR/usr/share/doc/shadowpainel/README.md"
          chmod 755 "$DEBDIR/usr/bin/shadowpainel-desktop" "$DEBDIR/usr/lib/shadowpainel/shadowpainel-core"
          cat > "$DEBDIR/DEBIAN/control" <<EOF
          Package: shadowpainel
          Version: ${PKG_VERSION}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: NoteDarck
          Recommends: default-jre-headless
          Description: Painel local Rust para servidores Minecraft
          EOF
          dpkg-deb --root-owner-group --build "$DEBDIR" "${ROOT}.deb"
          rm -rf "$APPDIR" "$DEBDIR" appimagetool

      - name: Build DMG (macOS)
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -e
          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          hdiutil create -volname "ShadowPainel" -srcfolder "$ROOT" -ov -format UDZO -o "${ROOT}.dmg"
          rm -rf "$ROOT"

      - name: Build MSI + Burn Bundle (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -e
          choco install wixtoolset --no-progress -y
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin:/c/Program Files (x86)/WiX Toolset v3.11/bin"

          ROOT="${{ env.RELEASE_NAME }}-${{ matrix.name }}"
          mkdir -p "$ROOT/backend" "$ROOT/frontend/dist"
          cp "backend/target/release/${{ matrix.binary }}" "$ROOT/backend/shadowpainel-core.exe"
          cp "desktop/target/release/${{ matrix.desktop_binary }}" "$ROOT/shadowpainel-desktop.exe"
          cp -r frontend/dist/. "$ROOT/frontend/dist/"
          cp README.md "$ROOT/"
          cp packaging/shadowpainel.ico "$ROOT/"

          # ---------- MSI (silencioso, sem UI) ----------
          cat > installer.wxs <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="ShadowPainel" Language="1046" Codepage="65001" Version="$(var.ProductVersion)" Manufacturer="NoteDarck" UpgradeCode="2DFA8B31-0C89-4B55-9C3D-5B25F32D5F4A">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perUser" Platform="x64" />
              <MajorUpgrade DowngradeErrorMessage="Uma versão mais recente do ShadowPainel já está instalada." />
              <MediaTemplate EmbedCab="yes" />
              <Icon Id="ShadowPainelIcon" SourceFile="$(var.SourceDir)\shadowpainel.ico" />
              <Property Id="ARPPRODUCTICON" Value="ShadowPainelIcon" />
              <Feature Id="ProductFeature" Title="ShadowPainel" Level="1">
                <ComponentGroupRef Id="AppFiles" />
                <ComponentRef Id="StartMenuShortcut" />
              </Feature>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="LocalAppDataFolder"><Directory Id="INSTALLFOLDER" Name="ShadowPainel" /></Directory>
                <Directory Id="ProgramMenuFolder"><Directory Id="ApplicationProgramsFolder" Name="ShadowPainel" /></Directory>
              </Directory>
              <DirectoryRef Id="ApplicationProgramsFolder">
                <Component Id="StartMenuShortcut" Guid="*">
                  <Shortcut Id="ShadowPainelShortcut" Name="ShadowPainel" Description="Painel local para servidores Minecraft" Target="[INSTALLFOLDER]shadowpainel-desktop.exe" WorkingDirectory="INSTALLFOLDER" />
                  <RemoveFolder Id="RemoveApplicationProgramsFolder" On="uninstall" />
                  <RegistryValue Root="HKCU" Key="Software\NoteDarck\ShadowPainel" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </DirectoryRef>
            </Product>
          </Wix>
          EOF
          heat dir "$ROOT" -cg AppFiles -dr INSTALLFOLDER -gg -srd -sreg -sfrag -var var.SourceDir -out files.wxs
          candle -arch x64 -dProductVersion="${PKG_VERSION}.0" installer.wxs files.wxs -dSourceDir="$ROOT"
          light -sice:ICE38 -sice:ICE64 -sice:ICE91 installer.wixobj files.wixobj -out ShadowPainel.msi

          # ---------- Download robusto do WebView2 bootstrapper ----------
          echo "Baixando WebView2 bootstrapper..."
          WEBVIEW2_URL="https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          WEBVIEW2_FALLBACK="https://msedge.sf.net/WebView2/WebView2Bootstrapper.exe"

          download_webview2() {
            local url="$1"
            echo "Tentando: $url"
            rm -f MicrosoftEdgeWebView2Setup.exe
            if command -v powershell.exe >/dev/null 2>&1; then
              if powershell.exe -NoProfile -Command "Invoke-WebRequest -Uri '$url' -OutFile 'MicrosoftEdgeWebView2Setup.exe' -UseBasicParsing"; then
                return 0
              fi
            fi
            if command -v curl >/dev/null 2>&1; then
              if curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 300 \
                --output MicrosoftEdgeWebView2Setup.exe "$url"; then
                return 0
              fi
            fi
            if command -v wget >/dev/null 2>&1; then
              if wget -q --tries=5 --timeout=30 -O MicrosoftEdgeWebView2Setup.exe "$url"; then
                return 0
              fi
            fi
            return 1
          }

          if ! download_webview2 "$WEBVIEW2_URL"; then
            echo "Falha no link principal, tentando CDN alternativo..."
            if ! download_webview2 "$WEBVIEW2_FALLBACK"; then
              echo "ERRO: não foi possível baixar o WebView2 bootstrapper de nenhuma fonte"
              exit 1
            fi
          fi

          SIZE=$(stat -c%s MicrosoftEdgeWebView2Setup.exe 2>/dev/null || echo 0)
          echo "Tamanho do bootstrapper: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERRO: arquivo do WebView2 bootstrapper suspeito (muito pequeno)"
            exit 1
          fi

          # ---------- Burn Bundle (setup.exe com UI) ----------
          cat > bundle.wxs <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi"
               xmlns:bal="http://schemas.microsoft.com/wix/BalExtension">
            <Bundle Name="ShadowPainel" Version="$(var.ProductVersion)" Manufacturer="NoteDarck"
                    UpgradeCode="B7C3E9A1-4F2D-4E8A-9C5B-1A3D7F2E6B8C"
                    IconSourceFile="$(var.SourceDir)\shadowpainel.ico"
                    SplashScreenSourceFile="$(var.SourceDir)\shadowpainel.ico">
              <BootstrapperApplicationRef Id="WixStandardBootstrapperApplication.HyperlinkLicense">
                <bal:WixStandardBootstrapperApplication
                  LicenseUrl=""
                  Theme="hyperlinkLicense"
                  LogoFile="$(var.SourceDir)\shadowpainel.ico" />
              </BootstrapperApplicationRef>
              <Chain>
                <ExePackage Id="WebView2"
                            SourceFile="MicrosoftEdgeWebView2Setup.exe"
                            Compressed="yes"
                            Vital="no"
                            PerMachine="no"
                            InstallCommand="/silent /install"
                            DetectCondition="WV2Installed"
                            Permanent="no">
                  <RegistrySearch Id="WV2Machine"
                                  Root="HKLM"
                                  Key="SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
                                  Name="pv"
                                  Type="raw"
                                  Win64="no"
                                  Variable="WV2Installed" />
                  <RegistrySearch Id="WV2User"
                                  Root="HKCU"
                                  Key="Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
                                  Name="pv"
                                  Type="raw"
                                  Variable="WV2Installed" />
                </ExePackage>
                <MsiPackage Id="ShadowPainelMsi"
                            SourceFile="ShadowPainel.msi"
                            Compressed="yes"
                            Vital="yes"
                            Visible="no" />
              </Chain>
            </Bundle>
          </Wix>
          EOF
          candle -arch x64 -dProductVersion="${PKG_VERSION}.0" -dSourceDir="$ROOT" bundle.wxs -ext WixBalExtension
          light -ext WixBalExtension bundle.wixobj -out "${ROOT}.exe"

          rm -f installer.wxs files.wxs installer.wixobj files.wixobj bundle.wxs bundle.wixobj ShadowPainel.msi MicrosoftEdgeWebView2Setup.exe
          rm -rf "$ROOT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ShadowPainel-*
          if-no-files-found: error

  publish:
    name: Publicar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum ShadowPainel-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "ShadowPainel ${{ github.ref_name }}" \
            --generate-notes