[package]
name = "shadowpainel"
version = "0.8.4"
edition = "2021"
rust-version = "1.80"
description = "Painel multiplataforma para gerenciar servidores Minecraft"
license = "MIT"
repository = "https://github.com/NoteDarck/ShadowPainel"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
urlencoding = "2.1"
zip = "2.2"
qrcodegen = "1.8"
sha2 = "0.10"
md5 = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
