[package]
name = "shadowpainel"
version = "0.1.0"
edition = "2021"
description = "Painel multiplataforma para gerenciar servidores Minecraft"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
anyhow = "1"
