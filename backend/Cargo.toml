[package]
name = "shadowpainel"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Painel multiplataforma para gerenciar servidores Minecraft"
license = "MIT"
repository = "https://github.com/NoteDarck/ShadowPainel"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
